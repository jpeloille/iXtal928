# iXtal26 — l'IBM XT 5160 avec l'Hercules Graphics Card (G9.1, GR.3a).
#
# Ce fichier est COURT à dessein : le format et chaque clé sont documentés dans « ixtal26.cfg », et ce qui distingue
# le 5160 dans « ixtal26-xt.cfg », dont il ne change que la carte. Le mode matériel est celui du lancement (G13.11).
#
#   dotnet run -- --config ixtal26-xt-hercules.cfg --turbo
#
# Depuis Rider : profil « iXtal26 (IBM XT 5160, Hercules) ».

model = ibmxt
mem_size = 640
drive_a_type = 1
drive_b_type = 1

# DISQUETTE SEULE (GR.3a, D2 de la reconnaissance R3) : aucun profil n'a de disque dur sur le XT. Le XTIDE des portes
# (c8088dos.img de la recette g5w) n'est pas celui-ci, et os/8088-HDD-C.img est vierge ; le poser ferait écrire dans
# os/. Le bloc du disque fixe d'IBM est dans ixtal26-xt.cfg.
disc_a = os/pcdos20/pcdos20b.img
bpb_disable = 0

# L'Hercules (3B0h-3BFh, 64 Ko de mémoire vidéo, dont 32 Ko projetés en B0000h tant que le graphique n'est pas
# ouvert) : le texte de la MDA, plus le graphique 720 × 348 sur deux pages, que DOS ne pose pas : il demande un
# programme qui le fasse (HERCBANC de G9.1, ou un logiciel de l'époque).
gfxcard = hercules
