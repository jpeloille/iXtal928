# iXtal26 — un 286 complet : AMI 286 à chipset NEAT, 16 MHz, 4 Mo, deux lecteurs, deux
# disques durs de 152 Mo (C: MS-DOS 5.0, D: vierge), une SVGA Trident 8900D.
#
# C'EST LA MACHINE QUE LE CMOS FABRIQUÉ DÉCRIT. Les deux doivent s'accorder octet par
# octet, sinon le POST le dit : « CMOS memory size mismatch », « CMOS display type
# mismatch », ou un disque annoncé en type 0. Toute modification ici demande de
# régénérer nvr/.ami286.nvr — voir nvr/README.md.

model = ami286

# 286/16 : l'INDICE 4 de la table de l'ami286 (cpus_286, cpu_tables.cs:86), pas une
# fréquence. 0 = 286/6 … 6 = 286/25, la liste est dans ixtal26.cfg. Sans cette clé la
# machine tournait à 6 MHz, l'entrée 0.
#
# LE CMOS N'EN SAIT RIEN : NvrImage ne lit pas cette clé, donc la changer ne demande
# PAS de régénérer nvr/.ami286.nvr, quoi qu'en dise l'en-tête. Le POST passe à 16 MHz
# sans une plainte et DOS démarre depuis C:. Le « SYSTEM SPEED » du SETUP n'y peut
# rien : neat.cs n'appelle jamais cpu_set().
#
# Mesuré le 24 septembre 2026, binaire de 19:18 : --timer-check sur 60 s voit
# 15,999 MHz côté invité (-58 ppm) ; 60 s émulées coûtent 2,2 s d'hôte, contre 1,6 s
# à 6 MHz. Le temps réel tient avec une marge de 27.
cpu = 4

# G4.7 — le coprocesseur (PLAN-G4.md, décision n° 1) : un 80287, que la liste fpus_80286 du
# 286/16 accepte (« none », « 287 », « 287xl »). Le BIOS AMI le détecte seul (« Numeric
# Processor : Present ») ; `--make-nvr` pose en plus le bit 1 de l'octet 0x14 du CMOS.
# « none » rend la machine d'avant G4, et les boot-diffs de référence tournent sans.
# Attention, défaut de PCem (PCEM_BUGS.md, PB-70) : ce 287 compare l'infini en affine, comme un
# 387 — MSD l'annonce « 80286/80387 ».
fpu = 287

# 4096 Ko, DONT 3072 AU-DELÀ DE 1 Mo. Le seuil de PCem est `mem_size > 1024` et non
# `>= 1024` : à 1024 pile, rien n'est mappé au-dessus de 1 Mo, les 384 Ko du haut
# tombant dans l'espace des ROM et de la vidéo. Seul un IBM AT les récupère, par
# mem_remap_top_384k, que at_neat_init n'appelle pas.
#
# Bornes du modèle : de 512 à 16384 Ko par pas de 128 (model.cs:206-208). Hors bornes,
# pc.cs:246-254 le DIT sur la sortie d'erreur et retombe sur max_ram, soit 16384 — donc
# une faute de frappe ici donne une machine de 16 Mo, pas un refus.
mem_size = 4096

# A: = 3,5" haute densité 1,44 Mo, B: = 5,25" haute densité 1,2 Mo.
#
# ATTENTION, DEUX NUMÉROTATIONS SE CROISENT ICI. Ces valeurs sont les types de PCem
# (fdd.cs:88-112) ; le CMOS, lui, code les mêmes lecteurs autrement. 1,44 Mo est le type
# PCem 5 mais le quartet CMOS 4 ; 1,2 Mo est le type 2 ET le quartet 2. L'octet CMOS
# 0x10 vaut donc 0x42 et non 0x52. Les confondre est silencieux.
#
# ET AUCUNE DISQUETTE DE CE DÉPÔT N'AMORCE DEPUIS A:. pcdos20b.img fait 180 Ko sur
# 40 pistes, et un lecteur 3,5" ne double pas le pas (le type 5 n'a pas
# FLAG_DOUBLE_STEP). Cette machine démarre depuis C:. Pour installer C: la première
# fois, utiliser ixtal26-286-install.cfg, qui met un 1,2 Mo en A:.
drive_a_type = 5
drive_b_type = 2

# Pas de disquette montée : l'amorçage se fait sur le disque dur.
# disc_a =
# disc_b =

bpb_disable = 0

# LA TRIDENT 8900D (M19), 1 Mo, jusqu'a 24 bits par pixel ; c'etait la VGA d'IBM
# jusqu'au 25 septembre 2026. La carte decide de l'octet d'equipement du CMOS : une
# carte a ROM d'extension en C000 fait sortir le vecteur d'INT 10h de F000, et le POST
# de l'AMI exige alors que les bits 5-4 de 0x14 valent 00 (mesure en
# amic206.bin:0x9716). Une CGA, elle, doit dire 10 binaire. La VGA et les deux Trident
# ont toutes leur ROM en C000 : passer de l'une a l'autre ne demande PAS de regenerer
# le CMOS. --make-nvr lit cette cle et en deduit l'octet : les deux ne divergent pas.
gfxcard = tvga8900d

# LE CONTRÔLEUR D'UN AT, ET C'EST LUI QUI OUVRE LA TABLE DES 46 TYPES. Le Fixed Disk
# Adapter du XT n'adresse que quatre géométries et annoncerait ce disque en type 0 ;
# mfm_at prend la sienne du BIOS par CMD_SET_PARAMETERS, donc tous les types passent.
# Ports 0x1F0-0x1F7 et 0x3F6, IRQ 14.
hdd_controller = mfm_at

# C: — type 46, comme D: (voir plus bas), MS-DOS 5.0 installé : une partition FAT16
# amorçable de 133,7 Mo.
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/286-HDD-C.img

# D: — type 46, vérifié dans la ROM elle-même (amic206.bin, table à F000:E401, entrée
# 46 en 0xE6D1 : c8 04 0f … 11) : 1224 cylindres, 15 têtes, 17 secteurs, soit
# 159 805 440 octets. C'est le plus gros type que ce BIOS connaisse.
#
# SA FIN EST INATTEIGNABLE POUR DOS, et c'est le BIOS qui le veut : l'INT 13h écrête les
# cylindres à 1023 (AH=08h, 0xA331-0xA33C, après un `sub ax,2`), donc FDISK dimensionne
# le disque à 1024 x 15 x 17 = 127,5 Mio.
#
# LE CMOS LE DÉCLARE DANS LE QUARTET BAS DE 0x12 (0x0F) ET EN 0x1A (46) : --make-nvr le
# fait dès que hdd_fn est posé. Sans fichier, D: ne doit PAS être déclaré : mfm_init
# charge les deux unités et le registre de commande fait fatal("Command on non-present
# drive") si le BIOS adresse une unité absente (mfm_at.c:193-194).
hdd_cylinders = 1224
hdd_heads = 15
hdd_sectors = 17
hdd_fn = os/286-HDD-D.img
