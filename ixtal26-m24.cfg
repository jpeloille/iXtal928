# iXtal26 — l'Olivetti M24 (G1, PLAN-G1.md) : 8086/7,16, 640 Ko, la CGA 640 × 400 de la M24,
# deux lecteurs 360 Ko, PC-DOS 2.00 en A:. Pas de CMOS à fabriquer : PCem n'en lit aucun pour la
# M24 (nvr.c:521-522).

model = olivetti_m24

# 8086/7,16 : l'INDICE 0 de cpus_8086 (cpu_tables.cs). 1-5 = 8, 9,54, 10, 12, 16 MHz.
cpu = 0

mem_size = 640

drive_a_type = 1
drive_b_type = 1
disc_a = os/pcdos20/pcdos20b.img

bpb_disable = 0

# La souris de la M24, par la file de son clavier (keyboard_olim24.c) : l'indice 5 de mouse_list.
mouse_type = 5
