# iXtal26 — un 286 complet : AMI 286 à chipset NEAT, 4 Mo, deux lecteurs, un disque
# dur de 152 Mo.
#
# C'EST LA MACHINE QUE LE CMOS FABRIQUÉ DÉCRIT. Les deux doivent s'accorder octet par
# octet, sinon le POST le dit : « CMOS memory size mismatch », « CMOS display type
# mismatch », ou un disque annoncé en type 0. Toute modification ici demande de
# régénérer nvr/.ami286.nvr — voir nvr/README.md.

model = ami286

# 4096 Ko, DONT 3072 AU-DELÀ DE 1 Mo. Le seuil de PCem est `mem_size > 1024` et non
# `>= 1024` : à 1024 pile, rien n'est mappé au-dessus de 1 Mo, les 384 Ko du haut
# tombant dans l'espace des ROM et de la vidéo. Seul un IBM AT les récupère, par
# mem_remap_top_384k, que at_neat_init n'appelle pas.
#
# Bornes du modèle : de 512 à 16384 Ko par pas de 128 (model.cs:206-208). Hors bornes,
# pc.cs:246-254 le DIT sur la sortie d'erreur et retombe sur max_ram, soit 16384 — donc
# une faute de frappe ici donne une machine de 16 Mo, pas un refus.
mem_size = 4096

# A: = 3,5" haute densité 1,44 Mo, B: = 5,25" haute densité 1,2 Mo.
#
# ATTENTION, DEUX NUMÉROTATIONS SE CROISENT ICI. Ces valeurs sont les types de PCem
# (fdd.cs:88-112) ; le CMOS, lui, code les mêmes lecteurs autrement. 1,44 Mo est le type
# PCem 5 mais le quartet CMOS 4 ; 1,2 Mo est le type 2 ET le quartet 2. L'octet CMOS
# 0x10 vaut donc 0x42 et non 0x52. Les confondre est silencieux.
#
# ET AUCUNE DISQUETTE DE CE DÉPÔT N'AMORCE DEPUIS A:. pcdos20b.img fait 180 Ko sur
# 40 pistes, et un lecteur 3,5" ne double pas le pas (le type 5 n'a pas
# FLAG_DOUBLE_STEP). Cette machine démarre depuis C:. Pour installer C: la première
# fois, utiliser ixtal26-286-install.cfg, qui met un 1,2 Mo en A:.
drive_a_type = 5
drive_b_type = 2

# Pas de disquette montée : l'amorçage se fait sur le disque dur.
# disc_a =
# disc_b =

bpb_disable = 0

# LA VGA D'IBM, transcrite a M15. C'est elle qui decide de l'octet d'equipement
# du CMOS : une carte a ROM d'extension en C000 fait sortir le vecteur d'INT 10h
# de F000, et le POST de l'AMI exige alors que les bits 5-4 de 0x14 valent 00
# (mesure en amic206.bin:0x9716). Une CGA, elle, doit dire 10 binaire.
# --make-nvr lit cette cle et en deduit l'octet : les deux ne peuvent pas diverger.
gfxcard = vga

# LE CONTRÔLEUR D'UN AT, ET C'EST LUI QUI OUVRE LA TABLE DES 46 TYPES. Le Fixed Disk
# Adapter du XT n'adresse que quatre géométries et annoncerait ce disque en type 0 ;
# mfm_at prend la sienne du BIOS par CMD_SET_PARAMETERS, donc tous les types passent.
# Ports 0x1F0-0x1F7 et 0x3F6, IRQ 14.
hdd_controller = mfm_at

# Type 46 de la table du BIOS, vérifié dans la ROM elle-même (amic206.bin, table à
# F000:E401, entrée 46 en 0xE6D1 : c8 04 0f … 11) : 1224 cylindres, 15 têtes,
# 17 secteurs, soit 159 805 440 octets. C'est le plus gros type que ce BIOS connaisse.
#
# SA FIN EST INATTEIGNABLE POUR DOS, et c'est le BIOS qui le veut : l'INT 13h écrête les
# cylindres à 1023 (AH=08h, 0xA331-0xA33C, après un `sub ax,2`), donc FDISK dimensionne
# le disque à 1024 x 15 x 17 = 127,5 Mio. Les deux cents derniers cylindres sont
# déclarés et jamais lus. Le fichier, lui, se crée en entier.
#
# Créer l'image :
#   dotnet run --project iXtal26 -- --create-hdd 46 os/vierge-hdd-type46.img
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/vierge-hdd-type46.img

# PAS DE SECOND DISQUE, et ce n'est pas un oubli : mfm_init charge les DEUX unités
# depuis ide_fn[0] et ide_fn[1], et le registre de commande fait
# fatal("Command on non-present drive") si le BIOS adresse une unité absente
# (mfm_at.c:193-194). Le quartet bas du CMOS 0x12 doit donc rester à zéro.
# hdd_cylinders =
# hdd_heads =
# hdd_sectors =
# hdd_fn =
