# G13.7d1 — l'ami486 sans disque dur, deux lecteurs de disquette, un lecteur ZIP 100 ATAPI en maître secondaire, chargé
# d'une image vierge de 100 663 296 octets que tools/listings-jit.sh crée, creuse, dans son bac à sable : le scénario
# ami486-zip des listings. Le CMOS, de --make-nvr sur ce fichier.
model = ami486
cpu = 10
fpu = builtin
mem_size = 4096
drive_a_type = 5
drive_b_type = 2
gfxcard = tvga9000b
hdd_controller = ide
zip_channel = 2
zip_path = zip100.img
