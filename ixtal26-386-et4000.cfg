# iXtal26 — le 386DX de ixtal26-386.cfg avec la Tseng ET4000AX (G9.3, GR.3a).
#
# Ce fichier est COURT à dessein : chaque clé est documentée dans « ixtal26-386.cfg » (la machine, son CMOS, son
# disque, la Sound Blaster Pro v2), dont il ne change que la carte et le chemin du disque. Le mode matériel est
# celui du lancement (G13.11).
#
#   dotnet run -- --config ixtal26-386-et4000.cfg
#
# Depuis Rider : profil « iXtal26 (386DX, ET4000AX, sans turbo) ».
#
# AVANT LE PREMIER LANCEMENT, ce que ce dépôt ne fait pas à votre place — le disque de CE profil, une copie de celui
# du 386 (GR.3a : un profil n'écrit pas sur les images d'un autre ; sans fichier, la clé en crée un VIDE) :
#   cp os/386-HDD-C.img os/386-ET4000-C.img
# Le CMOS est celui du 386, nvr/.ami386dx_opti495.nvr, partagé : l'ET4000AX a sa ROM en C000 comme la Trident 9000B,
# et l'octet d'équipement (0x14) est le même — rien à régénérer.
#
# WINDOWS : Windows 3.11 tourne en VGA.DRV, 640 × 480 en 16 couleurs (le témoin de G9.3). La ROM de la carte ne rend
# pas les services VESA (mesuré, G9.3) : SVGA256.DRV est sans objet.

model = ami386dx
cpu = 3
fpu = 387
mem_size = 4096
drive_a_type = 5
drive_b_type = 2
bpb_disable = 0

# La Tseng ET4000AX et son RAMDAC.
gfxcard = et4000ax

hdd_controller = mfm_at
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/386-ET4000-C.img

# La Sound Blaster Pro v2, comme ixtal26-386.cfg. La section vient EN DERNIER : tout ce qui la suit lui appartient.
sndcard = sbprov2

[Sound Blaster Pro v2]
addr = 544
irq = 5
dma = 1
