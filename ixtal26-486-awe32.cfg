# iXtal26 — l'ami486 de ixtal26-486.cfg (ALi 1429, i486DX2/66, 4 Mo, le disque IDE, la Cirrus GD5429) avec la
# Sound Blaster AWE32 (G12.2 ; PLAN-G12.md) : la SB 16 (DSP 4.13) et l'EMU8000, 512 Ko de RAM.
#
# AVANT LE PREMIER LANCEMENT :
#   - le disque et le CMOS de ixtal26-486.cfg, qu'il partage (os/486-HDD-C.img, nvr/.ami486.nvr) ; voir l'en-tête
#     de ce fichier ;
#   - la ROM de l'EMU8000, que ce dépôt ne fournit pas : roms/awe32.raw, 1 048 576 octets (une image AWE-DUMP
#     convient : PCem la recale, sound_emu8k.c:2024-2029). Sans elle, ou d'une autre taille, la carte est refusée
#     avec un avertissement, et la machine démarre sans carte son (PB-166).

model = ami486
cpu = 10
fpu = builtin
mem_size = 4096

drive_a_type = 5
drive_b_type = 2

bpb_disable = 0

gfxcard = cl_gd5429

hdd_controller = ide
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/486-HDD-C.img

# L'AWE32 (G12.2) : le DSP en 220h, l'EMU8000 en 620h (A20h et E20h), 512 Ko de RAM — le défaut de PCem ; 0, 2 048,
# 8 192 et 28 672 Ko sont les autres valeurs de onboard_ram. L'IRQ 7, le DMA 1 et le DMA 16 bits 5 sont ceux de la
# SB 16 (PB-153), le MPU-401 fixe en 330h (PB-154). Côté DOS :
#   SET BLASTER=A220 I7 D1 H5 P330 E620 T6
# La carte demande une machine AT (la règle ISA 16 bits, décision n° 4). La section vient EN DERNIER.
sndcard = sbawe32

[Sound Blaster AWE32]
addr = 544
emu_addr = 1568
onboard_ram = 512
