# Configuration machine d'iXtal26 — l'IBM XT 5160.
#
# Ce fichier est COURT à dessein. Le format, la signification de chaque clé et les
# pièges sont documentés une seule fois, dans « ixtal26.cfg » : deux fichiers qui se
# ressemblent à 95 % finissent par diverger, un fichier qui renvoie à l'autre non.
# On ne garde ici que ce qui distingue le 5160 du 5150.
#
#   dotnet run -- --config ixtal26-xt.cfg --turbo
#
# Depuis Rider : profil « iXtal26 (IBM XT 5160) ».

# LA SEULE LIGNE QUI COMPTE VRAIMENT. PCem câble le 5150 et le 5160 avec le même
# xt_init() ; tout le reste — 8088 à 4,77 MHz, CGA, contrôleur de disquettes — est
# identique. Ne changent que le BIOS chargé (roms/ibmxt/xt.rom, 64 Ko d'un bloc, BASIC
# compris, là où le 5150 charge 8 Ko plus quatre fichiers basicc11.*), le port cassette
# que seul le 5150 reçoit, et la granularité mémoire ci-dessous.
#
# --model ibmxt fait la même chose en ligne de commande, et l'emporte sur cette clé.
model = ibmxt

# ATTENTION, C'EST LE PIÈGE DU 5160 : sa granularité RAM est de 64 Ko, pas 32
# (model.c:782 contre :777). mem_size = 96 est accepté sur ibmpc et REFUSÉ ici, avec
# un message nommant la machine. Les bornes restent 64 à 640.
#
# Autre différence, invisible mais utile à savoir : sur le XT, la taille mémoire ne
# passe PAS par l'interrupteur SW2. La lecture du port 0x62 part dans une autre branche
# et ne porte que la configuration vidéo ; le BIOS du 5160 détermine sa mémoire en
# balayant. Le couplage « mem_size ↔ durée d'amorçage » du 5150 ne s'y transfère pas
# (VERIFICATION.md § M10).
mem_size = 640

# 5,25" double densité, comme le 5150.
drive_a_type = 1
drive_b_type = 1

# Même image que la machine de référence : le XT amorce PC DOS 2.00, et cet amorçage
# est vert au diff contre le C de PCem — 22 086 920 instructions identiques
# (VERIFICATION.md § M10). Commenter cette ligne fait tomber le XT sur SA ROM BASIC,
# celle de xt.rom ; c'est ce que fait le profil « iXtal26 (IBM XT 5160, ROM BASIC) ».
#
# os/ n'est pas versionné : sur un clone neuf l'image est absente, iXtal26 le dit et
# part sur la ROM BASIC.
disc_a = os/pcdos20/pcdos20b.img
# disc_b =

bpb_disable = 0

# ---------------------------------------------------------------------------
# LE DISQUE DUR — l'IBM Fixed Disk Adapter (VERIFICATION.md § M12)
#
# C'est ce que veut dire le « XT » : le 5160 est le premier IBM PC livré avec un
# disque fixe dans sa configuration standard. Le contrôleur est une CARTE, pas la
# carte mère, de conception Xebec, avec sa propre ROM d'extension en 0xC8000 qui
# apporte l'INT 13h du disque fixe — le BIOS du 5160 n'en contient pas une ligne.
# Elle prend l'IRQ 5 et le canal DMA 3, que personne d'autre n'occupe ici.
#
# TOUT CE BLOC EST COMMENTÉ, ET C'EST DÉLIBÉRÉ. La carte n'est pas gratuite : sa ROM
# s'insère dans le balayage du POST et change la trajectoire entière de l'amorçage.
# Et « os/ » n'est pas versionné, images de disque dur comprises — sur un clone neuf
# il n'y a pas de disque à monter. Une carte active par défaut choisirait donc entre
# se plaindre à chaque démarrage et fabriquer 10 Mo dans l'arbre sans qu'on l'ait
# demandé. Décommenter les quatre clés ci-dessous fait les deux choses qu'il faut :
# la carte apparaît, et le fichier est créé s'il manque.
#
# Deux noms internes sont transcrits. « mfm_xebec » est la carte d'IBM ; « dtc5150x »
# est la DTC 5150X, qui vient gratuitement parce que mfm_xebec.c porte les deux et
# partage leurs quatre fonctions. Seule mfm_xebec a été exercée sous oracle.
#
# hdd_controller = mfm_xebec

# ET IL N'Y A MÊME PAS BESOIN DE CE BLOC pour un essai : « --hdd IMAGE » monte un
# disque sans fichier de configuration, en déduisant sa géométrie de la taille du
# fichier. Ce bloc sert à une machine qu'on relance souvent.
#
# IL N'Y A PAS À RECOPIER CES CHIFFRES. « dotnet run -- --create-hdd » liste les 46
# types de disque du BIOS en marquant ceux que cette carte accepte, et
# « --create-hdd 1 » fabrique l'image ET imprime les quatre clés ci-dessous, prêtes à
# coller. Voir VERIFICATION.md § M12.1. Le tableau reste ici pour être lu.
#
# LA GÉOMÉTRIE N'EST PAS LIBRE. xebec_set_switches (mfm_xebec.c:716-747) n'accepte
# que 17 secteurs par piste et QUATRE couples (cylindres, têtes) :
#
#   cylindres  têtes   secteurs   capacité      type de la carte
#      306       4        17      10 653 696    type 0   <- le 10 Mo historique
#      612       4        17      21 307 392    type 16
#      615       4        17      21 411 840    type 2
#      306       8        17      21 307 392    type 13
#
# Hors de ces quatre, la carte émet un avertissement et laisse ses interrupteurs à
# zéro : le disque est annoncé en type 0 quelle que soit sa vraie taille, et le POST
# diverge. Rien ne le refuse — c'est un avertissement, pas une erreur.
#
# Les préfixes de clés sont des LETTRES DE LECTEUR DOS, pas des numéros de
# contrôleur : hdc_ = C:, hdd_ = D:, … jusqu'à hdi_ = I:. Et « hdd_controller »
# ci-dessus n'a rien à voir avec les « hdd_ » de géométrie : collision de préfixe
# fortuite, héritée de PCem.
#
# hdc_sectors = 17
# hdc_heads = 4
# hdc_cylinders = 306

# L'image brute. Le mieux est de la FABRIQUER — « --create-hdd 1 » —, parce qu'elle fait
# alors ses 10 653 696 octets de zéros : tous les secteurs existent et valent zéro.
#
# Pointer un chemin libre marche aussi : le fichier est CRÉÉ vide (hdd_file.c:110-120,
# reproduit tel quel) et il grandit à la première écriture. Mais il n'est pas
# pré-alloué, et hdd_read_sectors ignore la fin de fichier : lire un secteur jamais
# écrit rend le contenu résiduel du tampon de la carte, pas des zéros. C'est
# reproductible — les deux côtés du diff font la même chose — mais le point de départ
# n'est plus connu.
#
# Dans les deux cas, sous PC DOS 2.00 :
#
#   FDISK           -> option 1, puis Échap ; la machine redémarre
#   FORMAT C: /S    -> « Format complete / System transferred »
#
# après quoi la machine amorce sur C:. Cet arc entier est vert au diff contre le C de
# PCem, image comparée octet par octet (VERIFICATION.md § M12).
#
# hdc_fn = os/xt-10mo.img
