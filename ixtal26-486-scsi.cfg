# iXtal26 — l'ami486 de ixtal26-486.cfg (ALi 1429, i486DX2/66, 4 Mo, Cirrus GD5429, SB Pro v2) avec un disque
# SCSI sur l'Adaptec AHA-1542C (G11 ; PLAN-G11.md) à la place de l'IDE. La ROM de la carte (BIOS v1.01, en
# DC000h) donne l'INT 13h du disque ; le BIOS de la carte mère n'en voit aucun.
#
# AVANT LE PREMIER LANCEMENT, trois étapes que ce dépôt ne fait pas à votre place :
#   - le disque, VIERGE, de 100 Mo — la géométrie ne sert qu'à la capacité, la ROM traduit en 64 × 32 :
#       --create-hdd 203,16,63 os/486-SCSI-C.img
#   - le CMOS, SANS disque (la carte mère n'a pas de contrôleur ; --make-nvr y pose le type 0). Il est
#     PARTAGÉ avec ixtal26-486.cfg (nvr/.ami486.nvr) : refaire celui de l'autre profil pour y revenir.
#       --make-nvr ixtal26-486-scsi.cfg nvr/.ami486.nvr --force
#   - DOS : amorcer la disquette 1 de MS-DOS 5.0 en A: (os/Dos 5.0/Disk01.img), puis FDISK, et après le
#     redémarrage FORMAT C:/S ; ou lancer le SETUP de la disquette.
# L'EEPROM de la carte (ID 7, DMA 7, IRQ 10) est nvr/default/aha1542c.nvr ; SCSISelect (Ctrl-A au POST) l'écrit
# dans nvr/.aha1542c.nvr, partagé par toutes les configurations.

model = ami486
cpu = 10
fpu = builtin
mem_size = 4096

drive_a_type = 5
drive_b_type = 2

bpb_disable = 0

gfxcard = cl_gd5429

# L'Adaptec AHA-1542C (G11) : en 334h, sa ROM en DC000h (la section du device ci-dessous). Le disque à l'ID 0
# (C:) ; les ID 1 à 6 sont les clés hdd_ à hdi_. Ni CD-ROM ni ZIP sur ce bus (PLAN-G11.md, décision n° 2).
hdd_controller = aha1542c
hdc_cylinders = 203
hdc_heads = 16
hdc_sectors = 63
hdc_fn = os/486-SCSI-C.img

# La Sound Blaster Pro v2 (G8), comme ixtal26-486.cfg : 220h, IRQ 5, DMA 1.
sndcard = sbprov2

[Sound Blaster Pro v2]
addr = 544
irq = 5
dma = 1

[Adaptec AHA-1542C (SCSI)]
addr = 820
bios_addr = 901120
