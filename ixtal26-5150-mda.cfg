# iXtal26 — l'IBM PC 5150 avec l'IBM Monochrome Display Adapter (G9.1, GR.3a).
#
# Ce fichier est COURT à dessein : le format et chaque clé sont documentés dans « ixtal26.cfg », la machine de
# référence, dont il ne change que la carte. Le mode matériel est celui du lancement (G13.11).
#
#   dotnet run -- --config ixtal26-5150-mda.cfg --turbo
#
# Depuis Rider : profil « iXtal26 (IBM PC 5150, MDA) ».

model = ibmpc
mem_size = 640
drive_a_type = 1
drive_b_type = 1

# PC DOS 2.00 en A:, comme la machine de référence ; sans l'image, le 5150 part sur sa ROM BASIC.
disc_a = os/pcdos20/pcdos20b.img
bpb_disable = 0

# LA SEULE LIGNE QUI COMPTE : la MDA (3B0h-3BBh, 4 Ko en B0000h, 80 × 25 en texte seul).
gfxcard = mda
