# iXtal26 — l'ami486 de ixtal26-486.cfg (ALi 1429, i486DX2/66, 4 Mo, le disque IDE, la Cirrus GD5429) avec la
# Sound Blaster 16 (G12.1 ; PLAN-G12.md) à la place de la Pro v2 : DSP 4.05, OPL3 par DBOPL, mélangeur CT1745,
# MPU-401 en UART.
#
# AVANT LE PREMIER LANCEMENT : le disque et le CMOS de ixtal26-486.cfg, qu'il partage (os/486-HDD-C.img,
# nvr/.ami486.nvr) ; voir l'en-tête de ce fichier.

model = ami486
cpu = 10
fpu = builtin
mem_size = 4096

drive_a_type = 5
drive_b_type = 2

bpb_disable = 0

gfxcard = cl_gd5429

hdd_controller = ide
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/486-HDD-C.img

# La Sound Blaster 16 (G12.1) en 220h. PCem n'a de clé ni pour son IRQ ni pour ses DMA (TODO sound_sb.c:1059,
# PB-153) : l'IRQ 7, le DMA 1 et le DMA 16 bits 5 de sb_dsp_init, que seuls les registres 80h et 81h du CT1745
# changent (l'IRQ 7 est aussi celle de l'imprimante). Le MPU-401 est fixe en 330h, sans IRQ (PB-154). Côté DOS :
#   SET BLASTER=A220 I7 D1 H5 P330 T6
# La carte demande une machine AT (la règle ISA 16 bits, décision n° 4). La section vient EN DERNIER.
sndcard = sb16

[Sound Blaster 16]
addr = 544
