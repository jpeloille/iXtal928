# iXtal26 — un 386DX : AMI 386DX à chipset OPTi 495, 33 MHz, 4 Mo, deux lecteurs, un
# disque dur de 152 Mo (C: MS-DOS 5.0, copie de celui du 286), une SVGA Trident 9000B.
#
# C'EST LA MACHINE QUE LE CMOS FABRIQUÉ DÉCRIT. Toute modification ici demande de
# régénérer nvr/.ami386dx_opti495.nvr :
#   --make-nvr ixtal26-386.cfg nvr/.ami386dx_opti495.nvr --force

model = ami386dx

# 386DX/33 : l'INDICE 3 de cpus_i386DX (cpu_tables.cs:115), pas une fréquence.
# 0 = 386DX/16, 1 = /20, 2 = /25, 3 = /33.
cpu = 3

# En Ko, même si les bornes de cette machine sont en Mo (pc.ram_bounds_kb) : de 1024 à
# 262144 par pas de 1024. 4 Mo est la taille vérifiée en G3.2.
mem_size = 4096

# A: = 3,5" 1,44 Mo, B: = 5,25" 1,2 Mo — les mêmes que le 286 (voir ixtal26-286.cfg
# pour les deux numérotations, PCem et CMOS, qui se croisent ici).
drive_a_type = 5
drive_b_type = 2

bpb_disable = 0

# La Trident 9000B (512 Ko). Sa ROM est en C000 comme celle de la 8900D : l'octet
# d'équipement du CMOS (0x14) est le même.
gfxcard = tvga9000b

hdd_controller = mfm_at

# C: — type 46, copie de os/286-HDD-C.img : ce que fait le 386 ne touche pas le disque
# du 286. Pas de D: : sans fichier, il ne doit pas être déclaré (mfm_at.c:193-194).
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/386-HDD-C.img
