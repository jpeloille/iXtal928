# iXtal26 — l'ami486 de ixtal26-486.cfg (ALi 1429, i486DX2/66, 4 Mo, les deux disques IDE, la Cirrus GD5429) avec la
# Sound Blaster 16 (G12.1 ; PLAN-G12.md) à la place de la Pro v2 : DSP 4.05, OPL3 par DBOPL, mélangeur CT1745,
# MPU-401 en UART.
#
# AVANT LE PREMIER LANCEMENT : les disques et le CMOS de ixtal26-486.cfg, qu'il partage (os/486-HDD-C.img,
# os/486-HDD-D.img, nvr/.ami486.nvr) ; voir l'en-tête de ce fichier.

model = ami486
cpu = 10
fpu = builtin
mem_size = 4096

drive_a_type = 5
drive_b_type = 2

bpb_disable = 0

gfxcard = cl_gd5429

hdd_controller = ide
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/486-HDD-C.img

# D: — l'esclave du canal primaire, comme dans ixtal26-486.cfg (voir ses commentaires) : le CMOS partagé le déclare.
hdd_cylinders = 1224
hdd_heads = 15
hdd_sectors = 17
hdd_fn = os/486-HDD-D.img

# La Sound Blaster 16 (G12.1) en 220h. Ses cavaliers (G13.8d3a ; PCem n'en a pas, TODO sound_sb.c:1059) : irq (2, 5, 7,
# 10), dma (0, 1, 3), dma16 (5, 6, 7, ou 0, « Use Low », sans effet en mode PCem) et mpu_addr (816 = 330h, 768 = 300h,
# 0 = sans MPU) ; sans clé, l'IRQ 7, le DMA 1, le DMA 16 bits 5 et le MPU en 330h en mode PCem, l'IRQ 5 d'usine en mode
# matériel (PB-153). Ce profil pose l'IRQ 7, celle qu'attend son disque (l'IRQ 7 est aussi celle de l'imprimante). 80h
# et 81h du CT1745 les changent ensuite. Côté DOS :
#   SET BLASTER=A220 I7 D1 H5 P330 T6
# La carte demande une machine AT (la règle ISA 16 bits, décision n° 4). La section vient EN DERNIER.
sndcard = sb16

[Sound Blaster 16]
addr = 544
irq = 7
