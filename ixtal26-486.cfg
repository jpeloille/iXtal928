# iXtal26 — l'ultime machine : AMI 486 à chipset ALi 1429, i486DX2/66 (coprocesseur intégré),
# 4 Mo, deux lecteurs, deux disques IDE de 152 Mo (C: et D:), une Cirrus Logic GD5429 VLB (G6, G7 ;
# PLAN-G7.md, décision n° 5). La même machine avec la S3 Trio64 : ixtal26-486-s3.cfg.
#
# AVANT LE PREMIER LANCEMENT, trois fichiers que ce dépôt ne fabrique pas à votre place :
#   - C: : copier un disque existant (par exemple os/386-HDD-C.img, MS-DOS 5.0 et
#     Windows 3.1) vers os/486-HDD-C.img, ou en créer un vierge de type 46 (--create-hdd) ;
#   - D: : copier le disque vierge os/vierge-hdd-type46-2.img vers os/486-HDD-D.img, puis, dans
#     DOS, FDISK (disque 2, une partition primaire) et FORMAT D: ;
#   - le CMOS, que le POST exige — sans lui, « CMOS memory size mismatch » :
#       --make-nvr ixtal26-486.cfg nvr/.ami486.nvr
#     à refaire (--force) après toute modification de ce fichier.

model = ami486

# i486DX2/66 : l'INDICE 10 de cpus_i486 (cpu_tables.cs). 0-4 = i486SX/16 à SX2/50,
# 5-7 = i486DX/25 à /50, 8-10 = DX2/40, /50, /66, 11-12 = iDX4/75, /100. Les Pentium
# OverDrive (13, 14) sont exclus (décision utilisateur du 03/10). Intel seul (décision du 01/10/2026).
cpu = 10

# Le coprocesseur est intégré : fpus_builtin n'a qu'une entrée.
fpu = builtin

# En Ko ; bornes de 1 à 256 Mo par pas de 1 Mo. 4 Mo, la taille vérifiée en G6.
mem_size = 4096

drive_a_type = 5
drive_b_type = 2

bpb_disable = 0

# La Cirrus Logic GD5429 (G7.1), sur le bus local : 2 Mo, ROM 5429.vbi.
gfxcard = cl_gd5429

# L'IDE (G5), le contrôleur par défaut de l'ami486. Le BIOS le pilote par le type 46 du CMOS.
hdd_controller = ide
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/486-HDD-C.img

# D: — l'esclave du canal primaire, type 46 comme C: (ixtal26-286.cfg dit pourquoi DOS n'en voit que 127,5 Mio).
# --make-nvr le déclare dans le quartet bas de 0x12 et en 0x1A dès que hdd_fn est posé. Le CMOS est partagé par les
# profils IDE de l'ami486 (-s3, -sb16, -awe32, -covox, -dss), qui portent ces quatre lignes eux aussi : un profil
# sans D: sous un CMOS qui le déclare s'arrêterait au POST. Sans le fichier, l'unité est absente (loadhd, ide.cs) et
# le POST le dit. Les portes retirent ces lignes (g5w-recipe.sh) : leur CMOS, c486.nvr, ne déclare que C:.
hdd_cylinders = 1224
hdd_heads = 15
hdd_sectors = 17
hdd_fn = os/486-HDD-D.img

# GR.3b — le lecteur de CD-ROM ATAPI (G10.4), maître du canal IDE secondaire (176h, IRQ 15), VIDE. Pour un disque :
# cdrom_drive = 200 et cdrom_path = l'image (.iso, ou une feuille .cue) ; la fenêtre n'a pas de menu pour en charger
# une. Le Creative CR-587-B, un 24x de la norme SFF-8020i, celui des portes. Le BIOS de l'ami486 ne touche pas le canal
# secondaire, et le disque n'a ni pilote ATAPI ni MSCDEX : DOS ne voit le lecteur qu'avec eux.
# L'écoute du CD (GR.3i) : « tools/ecoute/ecoute.sh cd » ouvre ce profil, la feuille d'écoute d'isogen dans le
# lecteur et la disquette d'écoute en B: ; puis B:CDECOUTE, qui parle au lecteur sans pilote.
cdrom_channel = 2
cdrom_drive = -1
cd_model = cr-587-b

# GR.3b — le port parallèle LPT1 (378h), vide ; ixtal26-486-dss.cfg et ixtal26-486-covox.cfg y branchent la Disney Sound
# Source et le Covox (PLAN-G10.md, décision n° 3).
lpt1_device = none

# GR.3b — la manette : le type 0 (deux axes, deux boutons) sur le port jeu (201h), branchée par la section
# [Joysticks], plus bas, sur la manette 1 de l'hôte.
joystick_type = 0

# La Sound Blaster Pro v2 (G8) : OPL3 par DBOPL, DSP 3.02, mélangeur CT1345. 220h, IRQ 5, DMA 1
# (PLAN-G8.md, décision n° 5 ; l'IRQ 7 par défaut de PCem est celle de l'imprimante), posés par
# la section du device, que device_get_config_int lit comme PCem (device.c:94-104). Côté DOS :
#   SET BLASTER=A220 I5 D1 T4
# Les sections viennent EN DERNIER : tout ce qui suit une section lui appartient, jusqu'à la suivante.
sndcard = sbprov2

[Sound Blaster Pro v2]
addr = 544
irq = 5
dma = 1

# GR.3b — la manette 1 de l'hôte (SDL) : ses axes 0 et 1, ses boutons 0 et 1. Sans manette sur l'hôte, l'invité en
# voit une branchée, au repos (son état reste à zéro) ; joystick_0_nr = 0 rend le port vide (0FFh en 201h).
[Joysticks]
joystick_0_nr = 1
joystick_0_axis_0 = 0
joystick_0_axis_1 = 1
joystick_0_button_0 = 0
joystick_0_button_1 = 1
