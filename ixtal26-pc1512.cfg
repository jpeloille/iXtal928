# iXtal26 — l'Amstrad PC1512 (G1, PLAN-G1.md) : 8086/8, 640 Ko, la CGA du PC1512 et son mode
# plan 640 × 200 × 16, deux lecteurs 360 Ko, PC-DOS 2.00 en A:. Le CMOS de référence est
# nvr/default/pc1512.nvr (celui que PCem livre) ; la session écrit nvr/.pc1512.nvr.

model = pc1512

# 8086/8 : la seule entrée de cpus_pc1512.
cpu = 0

mem_size = 640

drive_a_type = 1
drive_b_type = 1
disc_a = os/pcdos20/pcdos20b.img

bpb_disable = 0

# La souris Amstrad, sur ses ports 78h/7Ah (amstrad.c) : l'indice 4 de mouse_list.
mouse_type = 4
