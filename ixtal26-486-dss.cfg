# iXtal26 — l'ami486 de ixtal26-486.cfg, sans le CD ni la manette, avec la Disney Sound Source sur LPT1.
#
# Ce fichier est COURT à dessein : chaque clé est documentée dans « ixtal26-486.cfg », dont il ne change que le
# port parallèle (GR.3b ; PLAN-G10.md, décision n° 3 : LPT1 reste vide dans le profil de référence). Il sert l'écoute.
# Mêmes disques (C: et D:), même CMOS (nvr/.ami486.nvr) : rien à régénérer.
#
#   dotnet run -- --config ixtal26-486-dss.cfg
#
# L'écoute (GR.3i) : « tools/ecoute/ecoute.sh » prépare la disquette d'écoute dans /var/tmp/ixtal-gr/ et dit les
# quatre écoutes ; « tools/ecoute/ecoute.sh dss » ouvre ce profil, la disquette en B: ; puis B:LPTPLAY D.
#
# Depuis Rider : profil « iXtal26 (486DX2/66, IDE, Cirrus GD5429, Disney Sound Source, sans turbo) ».

model = ami486
cpu = 10
fpu = builtin
mem_size = 4096
drive_a_type = 5
drive_b_type = 2
bpb_disable = 0
gfxcard = cl_gd5429
hdd_controller = ide
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/486-HDD-C.img

# D: — l'esclave du canal primaire, comme dans ixtal26-486.cfg (voir ses commentaires) : le CMOS partagé le déclare.
hdd_cylinders = 1224
hdd_heads = 15
hdd_sectors = 17
hdd_fn = os/486-HDD-D.img

# LA LIGNE QUI COMPTE : la Disney Sound Source sur LPT1 (378h) — un DAC 8 bits mono derrière une file de 16 octets,
# vidée à 7 kHz ; le bit 6 de 379h dit la file pleine (lpt_dss.c, G10.0).
lpt1_device = dss

# La Sound Blaster Pro v2, comme ixtal26-486.cfg. La section vient EN DERNIER.
sndcard = sbprov2

[Sound Blaster Pro v2]
addr = 544
irq = 5
dma = 1
