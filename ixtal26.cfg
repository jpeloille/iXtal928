# Configuration machine d'iXtal26 — format .cfg de PCem.
#
#   clé = valeur          la valeur est TOUT le reste de la ligne
#   [entre crochets]      une section ; celles-ci nomment un périphérique
#   #                     commentaire, en DÉBUT de ligne seulement
#
# Lu uniquement si --config est passé :
#
#   dotnet run -- --config ixtal26.cfg --turbo
#
# Précédence : défauts du code, puis ce fichier, puis --ram / --drive-a / --drive-b.
# Les valeurs MATÉRIELLES ci-dessous sont celles des défauts : ce fichier décrit donc
# la machine de référence, celle que mesure VERIFICATION.md. Seul disc_a s'en écarte,
# pour que le lancement depuis l'IDE amorce DOS plutôt que la ROM BASIC.
# Le modifier change la machine ; le supprimer ne change rien.

# La seule machine transcrite. `model_c.models` n'a qu'une entrée ; un nom inconnu
# est refusé en citant ce qui existe, au lieu de démarrer autre chose en silence.
model = ibmpc

# Taille RAM en Ko : de 64 à 640, par pas de 32 (les bornes de l'entrée m_ibmpc de
# PCem). L'hexadécimal marche aussi — 0x100 vaut 256.
#
# C'EST LE RÉGLAGE QUI SE VOIT LE PLUS. La taille mémoire est l'interrupteur SW2 que
# lit le POST, et le test mémoire est linéaire : l'invite BASIC tombe à 12 s avec
# 64 Ko, 24 s avec 256, 52 s avec 640 (VERIFICATION.md § M8). Un 5150 à 64 Ko démarre
# donc vite SANS turbo — c'est la machine d'époque avec la RAM que la plupart avaient.
mem_size = 640

# Type de lecteur : 0 aucun, 1 = 5,25" double densité (celui du 5150), 2 = 5,25" HD,
# 4 = 3,5" DD, 5 = 3,5" HD, 7 = 3,5" ED. Au-delà du 1, le lecteur du 5150 refuse le
# support : fdd_can_read_medium ne reconnaît que la double densité.
drive_a_type = 1
drive_b_type = 1

# Images montées au démarrage. Chemin relatif à la racine du dépôt OU au répertoire
# courant — la résolution remonte depuis le binaire, donc un lancement depuis Rider
# (qui part de bin/Debug/net10.0) trouve la même image qu'un lancement depuis la
# racine. Une image introuvable le DIT et laisse le lecteur vide.
#
# --floppy-a l'emporte : quand la ligne de commande a parlé, la clé n'est pas lue.
#
# os/ n'est pas versionné (logiciels sous copyright) : sur un clone neuf l'image est
# absente, iXtal26 le dit et part sur la ROM BASIC. Commenter pour BASIC d'office.
disc_a = os/pcdos20/pcdos20b.img
# disc_b =

# 1 force img_load à deviner la géométrie depuis la TAILLE du fichier au lieu de lire
# le BPB. Utile sur une image dont le secteur 0 ment.
bpb_disable = 0

# Configuration par périphérique : la section porte le nom du device. Les quatre clés
# de la CGA existent et sont lues ; leurs défauts sont ceux de PCem.
# [CGA]
# display_type = 0
# composite_type = 0
# snow_enabled = 1
# contrast = 0
