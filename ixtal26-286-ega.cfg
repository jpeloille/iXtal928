# iXtal26 — le 286 de ixtal26-286.cfg avec l'IBM Enhanced Graphics Adapter (G9.2, GR.3a).
#
# Ce fichier est COURT à dessein : chaque clé est documentée dans « ixtal26-286.cfg » (la machine, son CMOS, ses
# deux disques), dont il ne change que la carte et les chemins des disques. Le mode matériel est celui du lancement
# (G13.11).
#
#   dotnet run -- --config ixtal26-286-ega.cfg
#
# Depuis Rider : profil « iXtal26 (286, EGA, sans turbo) ».
#
# AVANT LE PREMIER LANCEMENT, ce que ce dépôt ne fait pas à votre place — les disques de CE profil, des copies de ceux
# du 286 (GR.3a : un profil n'écrit pas sur les images d'un autre ; sans fichier, la clé en crée un VIDE) :
#   cp os/286-HDD-C.img os/286-EGA-C.img
#   cp os/286-HDD-D.img os/286-EGA-D.img
# Le CMOS est celui du 286, nvr/.ami286.nvr, partagé : l'EGA a sa ROM en C000 comme la Trident 8900D, et l'octet
# d'équipement (0x14) est le même — rien à régénérer.
#
# WINDOWS : celui du disque (3.1) est réglé en VGA.DRV, sans EGA.DRV (relevé de GR, R3-clotures.md § 1.8). Pour l'EGA,
# il faut d'abord son SETUP DOS (C:\WINDOWS, `SETUP`, l'affichage « EGA », la disquette des pilotes d'affichage), à
# faire sur la copie de ce profil, comme le témoin de G9.2 l'a fait sur le disque du 486 (VERIFICATION.md § G9.2).

model = ami286
cpu = 4
fpu = 287
mem_size = 4096
drive_a_type = 5
drive_b_type = 2
bpb_disable = 0

# L'EGA d'IBM, dans sa configuration par défaut (celle de PCem).
gfxcard = ega

hdd_controller = mfm_at
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/286-EGA-C.img
hdd_cylinders = 1224
hdd_heads = 15
hdd_sectors = 17
hdd_fn = os/286-EGA-D.img
