# G13.7c1 — l'ami486 sans disque dur, deux lecteurs de disquette (A: 1,44 Mo, B: 1,2 Mo), un lecteur de CD ATAPI en
# maître secondaire, chargé d'une image d'isogen que tools/listings-jit.sh écrit dans son bac à sable (isogen/) : les
# scénarios ami486-cd-cue et ami486-cd-iso des listings. Le CMOS, de --make-nvr sur ce fichier.
model = ami486
cpu = 10
fpu = builtin
mem_size = 4096
drive_a_type = 5
drive_b_type = 2
gfxcard = tvga9000b
hdd_controller = ide
cdrom_channel = 2
cdrom_drive = 200
cdrom_path = isogen/multi.cue
cd_speed = 4
cd_model = cr-587-b
