# G13.7d2a — l'ami486 et l'AHA-1542C, un disque SCSI vierge à l'ID 0 (20 × 64 × 32, 40 960 secteurs) que
# tools/listings-jit.sh crée, creux, dans son bac à sable, et deux lecteurs de disquette : le scénario ami486-aha des
# listings (le POST de la ROM de la carte, puis PC-DOS sur A:). Le CMOS, de --make-nvr sur ce fichier.
model = ami486
cpu = 10
fpu = builtin
mem_size = 4096
drive_a_type = 5
drive_b_type = 2
gfxcard = tvga9000b
hdd_controller = aha1542c
hdc_cylinders = 20
hdc_heads = 64
hdc_sectors = 32
hdc_fn = scsi-m2.img
