# iXtal26 — la MÊME machine que ixtal26-286.cfg, avec un 1,2 Mo en A: le temps
# d'installer le disque dur.
#
# POURQUOI ELLE EXISTE. La machine finale a un 3,5" 1,44 Mo en A:, et aucune disquette
# de ce dépôt ne peut y amorcer : pcdos20b.img fait 180 Ko sur 40 pistes, et le type 5
# n'a pas FLAG_DOUBLE_STEP (fdd.cs:104-105), donc le lecteur ne trouverait pas une
# piste sur deux. Le type 2, lui, l'a — c'est le 1,2 Mo qui lit les 360 Ko, comme sur
# une vraie machine de 1989.
#
# Le BIOS n'amorce que sur l'unité 0 : mettre la disquette en B: ne suffirait pas.
#
# À N'UTILISER QUE POUR FDISK, FORMAT C: ET SYS C:. Une fois C: amorçable, la machine
# est ixtal26-286.cfg, et ce fichier n'a plus d'emploi.
#
# IL FAUT RÉGÉNÉRER LE CMOS EN PASSANT DE L'UNE À L'AUTRE, et ce n'est pas cosmétique.
# config_name n'est jamais affecté dans ce dépôt (config.cs:54), donc les deux
# configurations lisent le MÊME nvr/.ami286.nvr. Laisser celui de ixtal26-286.cfg, qui
# déclare A: en 1,44 Mo, fait programmer le contrôleur de disquette pour de la haute
# densité 3,5" — et la disquette de 180 Ko devient illisible. Mesuré : « DISKETTE BOOT
# FAILURE », alors que le lecteur était bon et l'image intacte.
#
#   dotnet run --project iXtal26 -- --make-nvr ixtal26-286-install.cfg nvr/.ami286.nvr --force
#   ... FDISK, FORMAT C: /S ...
#   dotnet run --project iXtal26 -- --make-nvr ixtal26-286.cfg nvr/.ami286.nvr --force

model = ami286
cpu = 4
mem_size = 4096

# LA SEULE LIGNE QUI DIFFÈRE DE ixtal26-286.cfg.
drive_a_type = 2
drive_b_type = 2

disc_a = os/pcdos20/pcdos20b.img
# disc_b =

bpb_disable = 0

# LA VGA D'IBM, transcrite a M15. C'est elle qui decide de l'octet d'equipement
# du CMOS : une carte a ROM d'extension en C000 fait sortir le vecteur d'INT 10h
# de F000, et le POST de l'AMI exige alors que les bits 5-4 de 0x14 valent 00
# (mesure en amic206.bin:0x9716). Une CGA, elle, doit dire 10 binaire.
# --make-nvr lit cette cle et en deduit l'octet : les deux ne peuvent pas diverger.
gfxcard = vga

hdd_controller = mfm_at
hdc_cylinders = 1224
hdc_heads = 15
hdc_sectors = 17
hdc_fn = os/vierge-hdd-type46.img
